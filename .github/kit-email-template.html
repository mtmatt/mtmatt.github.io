<!-- Default email template in Kit, pasted in by hand: the API can't change templates.
     It has no side margins so the cover in new_posts.py can reach both edges.
     Kit needs the content, unsubscribe and address tags. -->
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body
    style="margin:0;padding:0;background-color:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;color:#2d2d2f"
  >
    {{ message_content }}
    <p style="margin:32px 18px 24px;font-size:12px;line-height:1.6;color:#6b7280">
      <a href="{{ unsubscribe_url }}" style="color:#6b7280">取消訂閱</a>
      |
      <a href="{{ subscriber_preferences_url }}" style="color:#6b7280">更新資料</a>
      | {{ address }}
    </p>
  </body>
</html>

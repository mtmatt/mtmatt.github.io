<!-- The monterey email template in Kit, pasted in by hand: the API can't change templates.
     It holds the blue page and white card; new_posts.py fills the card.
     Kit needs the content, unsubscribe and address tags. -->
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body style="margin:0;padding:0">
    <div
      style="padding:24px 12px;background-color:#6aa8f8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;color:#2d2d2f"
    >
      <div style="max-width:640px;margin:0 auto;background-color:#ffffff;border-radius:12px">
        {{ message_content }}
      </div>
      <p
        style="max-width:640px;margin:20px auto 0;font-size:12px;line-height:1.6;text-align:center;color:#1e3a5f"
      >
        <a href="{{ unsubscribe_url }}" style="color:#1e3a5f">取消訂閱</a>
        |
        <a href="{{ subscriber_preferences_url }}" style="color:#1e3a5f">更新資料</a>
        | {{ address }}
      </p>
    </div>
  </body>
</html>
